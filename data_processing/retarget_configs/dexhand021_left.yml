retargeting:
  type: position
  # Relative to --dex_retarget_dir (default: dexplore/data/assets);
  # generated by data_processing/make_dexhand021_urdf.py
  urdf_path: dexhand021/dexhand021_left_retarget.urdf

  # Active joints only; the 7 followers come from the URDF mimic tags
  target_joint_names: [ 'l_f_joint1_1', 'l_f_joint1_2', 'l_f_joint1_3',
                        'l_f_joint2_1', 'l_f_joint2_2', 'l_f_joint2_3',
                        'l_f_joint3_2', 'l_f_joint3_3',
                        'l_f_joint4_2', 'l_f_joint4_3',
                        'l_f_joint5_2', 'l_f_joint5_3' ]
  # Finger pads -> MANO tips, distal links (origin at DIP/IP) -> MANO DIP/IP,
  # thumb link1_3 -> MANO thumb MCP (without it the thumb IP drifts ~3 cm)
  target_link_names: [ "l_f_link1_pad", "l_f_link2_pad", "l_f_link3_pad", "l_f_link4_pad", "l_f_link5_pad",
                       "l_f_link1_4", "l_f_link2_4", "l_f_link3_4", "l_f_link4_4", "l_f_link5_4",
                       "l_f_link1_3" ]
  target_link_human_indices: [ 4, 8, 12, 16, 20, 3, 7, 11, 15, 19, 2 ]
  add_dummy_free_joint: True

  low_pass_alpha: 1
  ignore_mimic_joint: False
