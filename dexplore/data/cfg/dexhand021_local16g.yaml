# if given, will override the device setting in gym. 
env: 
  numEnvs: 8192
  envSpacing: 5
  episodeLength: 2000
  isFlagrun: False
  enableDebugVis: False
  playdataset: False
  projtype: "None"
  saveImages: False
  initVel: False
  moreRigid: True
  pdControl: True
  powerScale: 1.0
  controlFrequencyInv: 2 # 30 Hz
  stateInit: "Start" #Random
  rolloutLength: 2000
  hybridInitProb: 0.1
  dataFPS: 30
  dataFramesScale: 1 # 25->30fps
  ballSize: 1.0
  numObs: 1442
  numDof: 25
  motion_file: ./data
  # Left hand on mirrored GRAB data: use the mirrored object assets
  objectMirror: True

  robot_name: dexhand021
  localRootObs: False
  # Human order: wrist, index/middle/pinky/ring MCP-PIP-DIP, thumb CMC-MCP-IP
  keyBodies: ['left_hand_base', 'l_f_link2_2', 'l_f_link2_3', 'l_f_link2_4', 'l_f_link3_2', 'l_f_link3_3', 'l_f_link3_4', 'l_f_link5_2', 'l_f_link5_3', 'l_f_link5_4', 'l_f_link4_2', 'l_f_link4_3', 'l_f_link4_4', 'l_f_link1_2', 'l_f_link1_3', 'l_f_link1_4']
  contactBodies: ['l_f_link2_4', 'l_f_link3_4', 'l_f_link5_4', 'l_f_link4_4', 'l_f_link1_4']
  terminationHeight: 0.15
  enableEarlyTermination: True

  asset:
    assetRoot: "dexplore/data/assets"

  plane:
    staticFriction: 1.0
    dynamicFriction: 1.0
    restitution: 1.0
  
  rewardWeights:
    p: 2
    r: 0.
    pv: 0.
    rv: 0.0005

    op: 0.5
    or: 0.1
    opv: 0.
    orv: 0.

    ig: 20.

    cg1: 5.
    cg2: 5.

    eg1: 0.0002
    eg2: 0.00005
    eg3: 0.00002
sim:
  substeps: 4
  physx:
    num_threads: 8
    solver_type: 1  # 0: pgs, 1: tgs
    num_position_iterations: 8
    num_velocity_iterations: 1
    contact_offset: 0.01
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 20.0
    default_buffer_size_multiplier: 10.0
    max_gpu_contact_pairs: 16777216 # 16 GB GPU: use --num_envs 1024 (or 1536)
  flex:
    num_inner_iterations: 10
    warm_start: 0.25

