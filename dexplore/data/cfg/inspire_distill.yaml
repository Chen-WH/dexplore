# if given, will override the device setting in gym. 
env: 
  numEnvs: 784
  envSpacing: 10
  episodeLength: 2000
  isFlagrun: False
  enableDebugVis: False
  playdataset: False
  projtype: "None"
  enableCameraSensors: True
  saveImages: False
  initVel: False
  moreRigid: True
  pdControl: True
  powerScale: 1.0
  controlFrequencyInv: 2 # 30 Hz
  stateInit: "Start" #Random
  rolloutLength: 2000
  hybridInitProb: 0.1
  dataFPS: 30
  dataFramesScale: 1 # 25->30fps
  ballSize: 1.0
  numObs: 1442
  numDof: 18
  motion_file: ./data
  modelZoo: checkpoint/inspire.pth

  # ---- Distillation training knobs (best-known defaults) ----
  pointcloud_dr: True            # point cloud noise+dropout (sim2real readiness)
  obs_noise: True                # Gaussian noise on hand-key body positions
  wrist_masking: False           # KEEP wrist reference visible end-to-end (avoids train/eval gap)
  aux_loss_coef: 0.1             # auxiliary object-pose decoder loss
  kld_floor: 0.01                # KL coefficient floor (initial)
  kld_max: 0.1                   # KL coefficient max (10x stronger than legacy 0.01)
  kld_ramp_start: 0
  kld_ramp_epochs: 3000
  dagger_start_epoch: 50         # fast DAgger handoff
  dagger_decay_epochs: 1000      # beta hits 0 by epoch 1050
  mask_mimic_dims: False          # drop 6 Inspire mimic-slave dims from e_loss
  contact_loss_alpha: 0.0        # upweight contact frames in e_loss
  zero_vae_noise: False          # KEEP stochastic VAE (deterministic z breaks KL->prior info transfer)
  vae_latent_dim: 64

  robot_name: inspire
  localRootObs: False
  keyBodies: ['hand_base_link', 'index_proximal', 'index_intermediate', 'index_tip', 'middle_proximal', 'middle_intermediate', 'middle_tip', 'pinky_proximal', 'pinky_intermediate', 'pinky_tip', 'ring_proximal', 'ring_intermediate', 'ring_tip', 'thumb_proximal_base', 'thumb_intermediate', 'thumb_tip']
  contactBodies: ['index_intermediate', 'middle_intermediate', 'pinky_intermediate', 'ring_intermediate', 'thumb_distal']
  terminationHeight: 0.15
  enableEarlyTermination: True

  asset:
    assetRoot: "dexplore/data/assets"

  plane:
    staticFriction: 1.0
    dynamicFriction: 1.0
    restitution: 1.0
  
  rewardWeights:
    p: 2
    r: 0.
    pv: 0.
    rv: 0.0005

    op: 0.5
    or: 0.1
    opv: 0.
    orv: 0.

    ig: 20.

    cg1: 5.
    cg2: 5.

    eg1: 0.0002
    eg2: 0.00005
    eg3: 0.00002
sim:
  substeps: 4
  physx:
    num_threads: 8
    solver_type: 1  # 0: pgs, 1: tgs
    num_position_iterations: 8
    num_velocity_iterations: 1
    contact_offset: 0.01
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 20.0
    default_buffer_size_multiplier: 25.0
    max_gpu_contact_pairs: 41943040 # 8*1024*1024
  flex:
    num_inner_iterations: 10
    warm_start: 0.25

